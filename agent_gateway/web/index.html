<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TR3D Coach</title>
<style>
  :root {
    --bg: #fbfaf8;
    --panel: #ffffff;
    --ink: #1a1a19;
    --muted: #6b6a66;
    --line: #e6e3dd;
    --accent: #b8542f;
    --accent-soft: #f6ece7;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14140f;
      --panel: #1c1c18;
      --ink: #ecebe6;
      --muted: #9c9a92;
      --line: #2e2e27;
      --accent: #e08256;
      --accent-soft: #2a1f19;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    letter-spacing: .13em;
    text-transform: uppercase;
    margin: 0;
    font-weight: 650;
  }
  header .who { font-size: 13px; color: var(--muted); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px 8px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  /* Sign-in */
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
  }
  .card h2 { margin: 0 0 6px; font-size: 19px; }
  .card p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, textarea {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    flex: 1;
    min-width: 0;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: var(--accent); font-size: 14px; margin-top: 12px; }

  /* Chat */
  .msg { margin: 0 0 18px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 85%;
    padding: 11px 15px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--accent-soft); border: 1px solid var(--line); }
  .msg.coach .bubble { background: var(--panel); border: 1px solid var(--line); }
  .thinking { color: var(--muted); font-style: italic; }
  .suggest { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .suggest button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    font-weight: 400;
    font-size: 13.5px;
    padding: 7px 13px;
  }
  .suggest button:hover { color: var(--ink); border-color: var(--accent); }

  footer {
    border-top: 1px solid var(--line);
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    background: var(--panel);
  }
  footer .wrap { display: flex; gap: 8px; align-items: flex-end; }
  textarea { resize: none; max-height: 140px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>TR3D&nbsp;Coach</h1>
  <span class="who" id="who"></span>
</header>

<main>
  <div class="wrap">

    <div id="signin" class="card">
      <h2>Connect your training plan</h2>
      <p>Send <strong>/mycode</strong> to the TR3D bot on Telegram, then paste the code here.</p>
      <div class="row">
        <input id="code" placeholder="ANDY-7K2M9QX4" autocomplete="off"
               autocapitalize="characters" spellcheck="false">
        <button id="linkBtn">Connect</button>
      </div>
      <div id="linkErr" class="err hidden"></div>
    </div>

    <div id="chat" class="hidden">
      <div class="suggest" id="suggest">
        <button>What's my session today?</button>
        <button>What paces should I run?</button>
        <button>How did last week go?</button>
        <button>When does my taper start?</button>
      </div>
      <div id="messages"></div>
    </div>

  </div>
</main>

<footer id="composer" class="hidden">
  <div class="wrap">
    <textarea id="input" rows="1" placeholder="Ask your coach…"></textarea>
    <button id="sendBtn">Send</button>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var TOKEN_KEY = "tr3d_gateway_token";
  var NAME_KEY  = "tr3d_gateway_name";

  var $ = function (id) { return document.getElementById(id); };
  var token = localStorage.getItem(TOKEN_KEY);
  var history = [];

  function show(signedIn) {
    $("signin").classList.toggle("hidden", signedIn);
    $("chat").classList.toggle("hidden", !signedIn);
    $("composer").classList.toggle("hidden", !signedIn);
    if (signedIn) {
      var name = localStorage.getItem(NAME_KEY);
      $("who").textContent = name ? "· " + name : "";
      $("input").focus();
    }
  }

  // Text is inserted with textContent, never innerHTML — model and API output
  // is never parsed as markup.
  function addMessage(role, text) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + role;
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
    $("messages").appendChild(wrap);
    wrap.scrollIntoView({ behavior: "smooth", block: "end" });
    return bubble;
  }

  async function link() {
    var code = $("code").value.trim();
    if (!code) return;
    var btn = $("linkBtn");
    btn.disabled = true;
    $("linkErr").classList.add("hidden");
    try {
      var r = await fetch("/api/link", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code })
      });
      var data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Could not connect.");
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      if (data.name) localStorage.setItem(NAME_KEY, data.name);
      show(true);
    } catch (e) {
      $("linkErr").textContent = e.message;
      $("linkErr").classList.remove("hidden");
    } finally {
      btn.disabled = false;
    }
  }

  async function send(text) {
    text = (text || $("input").value).trim();
    if (!text) return;
    $("input").value = "";
    $("input").style.height = "auto";
    $("suggest").classList.add("hidden");
    addMessage("user", text);

    var placeholder = addMessage("coach", "Thinking…");
    placeholder.classList.add("thinking");
    $("sendBtn").disabled = true;

    try {
      var r = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ message: text, history: history })
      });
      var data = await r.json();
      if (r.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        token = null;
        show(false);
        return;
      }
      if (!r.ok) throw new Error(data.detail || "Something went wrong.");
      placeholder.classList.remove("thinking");
      placeholder.textContent = data.reply;
      history.push({ role: "user", content: text });
      history.push({ role: "assistant", content: data.reply });
      history = history.slice(-20);
    } catch (e) {
      placeholder.classList.remove("thinking");
      placeholder.textContent = "⚠️ " + e.message;
    } finally {
      $("sendBtn").disabled = false;
      $("input").focus();
    }
  }

  $("linkBtn").addEventListener("click", link);
  $("code").addEventListener("keydown", function (e) {
    if (e.key === "Enter") link();
  });
  $("sendBtn").addEventListener("click", function () { send(); });
  $("input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $("input").addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 140) + "px";
  });
  $("suggest").addEventListener("click", function (e) {
    if (e.target.tagName === "BUTTON") send(e.target.textContent);
  });

  show(!!token);
})();
</script>
</body>
</html>
